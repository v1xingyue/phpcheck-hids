name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Check shell scripts
        run: |
          sh -n checking.sh
          sh -n prepare-private.sh

  build:
    needs: test
    strategy:
      matrix:
        include:
          - {os: linux, arch: '386', runner: ubuntu-24.04}
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Build stripped binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o "dist/phpcheck-${GOOS}-${GOARCH}" ./cmd/phpcheck
      - name: Smoke test native executable
        if: matrix.os == 'darwin' || matrix.arch == 'amd64'
        run: ./dist/phpcheck-${{ matrix.os }}-${{ matrix.arch }} -h
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phpcheck-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/phpcheck-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: phpcheck-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vMAJOR.MINOR.PATCH tag'; exit 1; }
          cp checking.sh prepare-private.sh dist/
          cd dist
          sha256sum phpcheck-linux-* phpcheck-darwin-* checking.sh prepare-private.sh > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes 'PHP2Shell assessment for HIDS on Linux and macOS. checking.sh automatically downloads, verifies and runs the matching binary. prepare-private.sh prepares a versioned private static mirror from --url and --static-dir. Configuration mitigation remains partial, not a complete fix. See README for usage.' \
            phpcheck-linux-* phpcheck-darwin-* checking.sh prepare-private.sh SHA256SUMS
